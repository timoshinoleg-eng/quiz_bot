name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Compile and import check
        run: |
          python -m compileall -q .
          python -c "import bot, db, models, services.game_logic"
      - name: Run beta tests
        run: pytest -q
      - name: Bootstrap and audit V2 content
        run: |
          python -m scripts.content.bootstrap
          python -m scripts.content.audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build Mini App
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t quiz_bot:ci .
      - name: Import image
        run: docker run --rm quiz_bot:ci python -c "import bot, db, models; print('image import ok')"
