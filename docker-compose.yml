services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quiz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quiz_pass}
      POSTGRES_DB: ${POSTGRES_DB:-quiz_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quiz_user} -d ${POSTGRES_DB:-quiz_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      BOT_USERNAME: ${BOT_USERNAME:-}
      BOT_MODE: ${BOT_MODE:-polling}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quiz_user}:${POSTGRES_PASSWORD:-quiz_pass}@postgres:5432/${POSTGRES_DB:-quiz_db}
      DAILY_QUESTION_COUNT: ${DAILY_QUESTION_COUNT:-5}
      CHALLENGE_QUESTION_COUNT: ${CHALLENGE_QUESTION_COUNT:-5}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
